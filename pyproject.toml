[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/archibald"]

[project]
name = "archibald"
version = "1.0.0"
description = "A lightweight library for interacting with ESRI ArcGIS REST APIs."
readme = {file = "README.md", content-type = "text/markdown"}
requires-python = ">=3.12"
authors = [
    {name = "Jesse Nestler", email = "nestlerj@bouldercolorado.gov"},
]
license = {file = "LICENSE"}
keywords = ["arcgis", "esri", "gis", "rest", "async", "geospatial"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: GIS",
    "Typing :: Typed",
]
dependencies = [
    "anyio>=4.13.0",
    "geopandas>=1.1.3",
    "httpx>=0.28.1",
    "pandas>=3.0.3",
    "pydantic>=2.13.4",
]

[project.urls]
Repository = "https://github.com/cityofboulder/archibald"
Documentation = "https://cityofboulder.github.io/archibald/"

[dependency-groups]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.27",
]
dev = [
    "anyio[trio]>=4.13.0",
    "ipykernel>=7.2.0",
    "pytest>=9.0.3",
    "pytest-mock>=3.15.1",
    "respx>=0.23.1",
    "pytest-cov>=6.0.0",
    "ruff>=0.15.13",
]

[tool.coverage.run]
source = ["archibald"]
branch = true

[tool.coverage.report]
fail_under = 80

[tool.pytest.ini_options]
anyio_mode = "auto"
markers = [
    "integration: full-stack tests with mocked HTTP transport",
]
