site_name: archibald
site_description: Async Python client for ArcGIS REST APIs
repo_url: https://github.com/cityofboulder/archibald

theme:
  name: material
  palette:
    primary: indigo
  features:
    - navigation.sections
    - content.code.copy

nav:
  - Home: index.md
  - Usage Guide: usage.md
  - API Reference:
    - Client: api/client.md
    - Authentication: api/auth.md
    - Services & Layers: api/services.md
    - Models: api/models.md
    - Exceptions: api/exceptions.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            show_source: false
            show_root_heading: true
            docstring_style: google

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
